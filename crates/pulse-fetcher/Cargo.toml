[package]
name = "pulse-fetcher"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pulse-fetcher"
path = "src/main.rs"

[dependencies]
rusqlite = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
feed-rs = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
pulse-pricing = { path = "../pulse-pricing" }
pulse-weights = { path = "../pulse-weights" }
pulse-llm = { path = "../pulse-llm" }
pulse-alpaca = { path = "../pulse-alpaca" }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
anyhow = { workspace = true }
dirs = "6"
dotenvy = { workspace = true }
futures = "0.3"
libc = "0.2"
# research lane: arXiv Atom (arxiv: extension elements feed-rs drops) and LaTeXML HTML.
# Both already in the lockfile transitively.
quick-xml = "0.37"
regex = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = { workspace = true }
# test-util is NOT in tokio's "full" feature set; needed for #[tokio::test(start_paused)]
# so the heartbeat tests advance virtual time instead of really sleeping 45s.
tokio = { workspace = true, features = ["test-util"] }
