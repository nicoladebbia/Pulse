name: PulsePhone
options:
  bundleIdPrefix: com.pulse
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "942QL2V6SV"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Pulse:
    type: application
    platform: iOS
    sources:
      - path: Pulse
      # The same file the Rust tests check. Only used by the -PulseFixture launch argument (Debug).
      - path: ../crates/pulse-snapshot/tests/fixtures/snapshot_v1.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulse.phone
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Pulse
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  PulseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PulseTests
      - path: ../crates/pulse-snapshot/tests/fixtures/snapshot_v1.json
        buildPhase: resources
    dependencies:
      - target: Pulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pulse.phone.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pulse.app/Pulse
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Pulse:
    build:
      targets:
        Pulse: all
    test:
      targets:
        - PulseTests
